name: release-please

# Maintains a Release PR (CHANGELOG + version bump from conventional commits).
# Merging that PR tags the release (bare `v*`) and creates the GitHub release.
#
# N193/N250 — the release-please Action must create that release with a BOT
# TOKEN (a PAT/GitHub App token in the `RELEASE_PLEASE_TOKEN` secret), NOT the
# default GITHUB_TOKEN. GitHub does not trigger downstream workflows from
# GITHUB_TOKEN events, so a GITHUB_TOKEN release never fires `release: published`.
# With a bot token the release fires that event, which triggers
# `release-publish.yml` directly — and there the OIDC token's top-level workflow
# is `release-publish.yml`, which matches npm's Trusted Publishing config (a
# `workflow_call` chain did NOT: its OIDC identity was this workflow, so npm
# minted no token and `npm publish` failed with ENEEDAUTH). So this workflow now
# only cuts the release; publishing lives entirely in release-publish.yml.
#
# Setup: create a fine-grained PAT (or GitHub App token) scoped to this repo with
# Contents: read/write + Pull requests: read/write, and add it as the repo secret
# `RELEASE_PLEASE_TOKEN`. Without it, release-please falls back to GITHUB_TOKEN
# and the release event will not fire (no publish).

on:
  push:
    branches: [main]

# Least privilege by default; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # N250 — a bot token so the created release fires `release: published`
          # (GITHUB_TOKEN would suppress it). Publishing is handled by that event
          # in release-publish.yml, not by a reusable-workflow chain.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
