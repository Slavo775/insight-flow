name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "packages/taskflow/scripts/sync-docs.mjs"
      - ".github/workflows/docs.yml"
      # Canonical sources the docs site syncs in:
      - "TASK_*_ROLE.md"
      - "TASKMASTER*_ROLE.md"
      - "AGENT_*.md"
      - "PR_API.md"
  workflow_dispatch:

# N276 (A67) — least privilege at the workflow level. The build job (which runs
# `pnpm install` over the whole workspace, incl. the large Docusaurus tree) gets
# only `contents: read`; the Pages/OIDC permissions are granted on the deploy
# job alone, so a compromised build-time dependency cannot mint a Pages token.
permissions:
  contents: read

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website (runs sync-docs first)
        run: pnpm --dir website build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Pages + OIDC live here, not at workflow level (A67).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
