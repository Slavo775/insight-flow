name: release-publish

# Publishes to npm. Uses npm Trusted Publishing (OIDC) — there is no NPM_TOKEN
# secret; provenance is attached.
#
# Two entry points, both trusted (never `pull_request`, so OIDC is never exposed
# to untrusted fork code):
#   - `release: published` — a human-published GitHub release (their token's event
#     cascades here).
#   - `workflow_call` — invoked by release-please.yml's chained `publish` job when
#     release-please created a release. This handles release-please's own
#     (bot/GITHUB_TOKEN) releases, whose `release: published` event GitHub
#     suppresses (N193). The two paths are mutually exclusive: a bot release only
#     reaches here via workflow_call; a human release only via `release:
#     published` (release-please didn't create it, so the chained job is skipped).

on:
  release:
    types: [published]
  workflow_call:
  # N201 — manual fallback: if the auto-chain ever misses (e.g. a skipped publish),
  # run this workflow by hand from the Actions tab to publish the current default
  # branch. Still gated by the `npm-publish` environment approval below.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional manual-approval gate; configure required reviewers on this
    # environment in repo Settings → Environments → npm-publish.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack sanity check (LICENSE present in tarball)
        working-directory: packages/taskflow
        run: npm pack --dry-run 2>&1 | grep -q "LICENSE" || { echo "LICENSE missing from package tarball"; exit 1; }
      - name: Publish to npm (OIDC + provenance)
        working-directory: packages/taskflow
        run: npm publish --provenance --access public
