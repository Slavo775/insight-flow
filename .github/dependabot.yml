# N276 (A21) — automated dependency + action update PRs. Pairs with enabling
# Dependabot alerts / security updates in repo Settings → Code security (a
# human step; see RELEASING.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
